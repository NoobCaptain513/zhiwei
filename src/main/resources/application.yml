spring:
  application:
    name: zhiwei
  profiles:
    active: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/zhiwei?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:zhiwei123}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:zhiwei}
    password: ${RABBITMQ_PASSWORD:zhiwei123}
    listener:
      simple:
        default-requeue-rejected: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    async:
      # SSE 流式接口最长等待时间，需大于 AiStreamAdvice.DEFAULT_TIMEOUT_MS（180s）
      # -1 表示无限制；这里设 300s 给足缓冲
      request-timeout: 300000


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# FIX-10: MQ 重试配置（必须配！否则毒消息 requeue 死循环）


zhiwei:
  ai:
    langchain4j:
      api-key: ${DASHSCOPE_API_KEY}
    native:
      api-key: ${DASHSCOPE_API_KEY}
    embedding:
      api-key: ${DASHSCOPE_API_KEY}
    datasource:
      pgvector:
        jdbc-url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/zhiwei_rag}
        username: ${POSTGRES_USER:zhiwei}
        password: ${POSTGRES_PASSWORD:zhiwei123}
        driver-class-name: org.postgresql.Driver
        maximum-pool-size: 10
    rag:
      sub-query-timeout-ms: 8000
      rewrite-cache-size: 1000
      rewrite-cache-ttl-seconds: 600
      agentic:
        enabled: ${AGENTIC_RAG_ENABLED:true}
        max-rewrite-attempts: 2
        max-candidate-k: 100
        min-evidence: 1
        classifier-model: qwen-plus
        grader-model: qwen-plus
        answer-model: qwen-plus
    knowledge:
      embed-batch-size: 16
      mq:
        retry-ttl-ms: 30000
        max-retries: 3
    safety:
      judge:
        enabled: true
        model: qwen-turbo
        fail-open: false
        max-chars: 1500
    health:
      event-redis-size: 1000
      event-redis-ttl-days: 7
    idempotency:
      # 幂等键缓存 TTL：客户端重试携带同一 Idempotency-Key 时，命中缓存直接返回首次结果，避免重复扣费
      ttl-hours: 24
  security:
    api-key-enabled: false
    api-keys: ${ZHIWEI_API_KEYS:}
    jwt:
      enabled: false
      secret: ${ZHIWEI_JWT_SECRET:changeme1234567890123456789012345}
      ttl-minutes: 120
      users:
        admin: "{noop}admin123"
        demo: "{noop}demo123"

